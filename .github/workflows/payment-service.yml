name: Payment service CI

on:
  pull_request:
    paths:
      - "services/payment/**"
      - ".github/workflows/payment-service.yml"
  push:
    branches: [main]
    paths:
      - "services/payment/**"
      - ".github/workflows/payment-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/payment

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gigzlk_payment_test

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gigzlk_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gigzlk_payment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/payment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx --no-install prisma validate --config ./prisma7.config.ts

      - name: Generate Prisma Client
        run: npx --no-install prisma generate --config ./prisma7.config.ts

      - name: Check source and test lint
        run: npx --no-install eslint "src/**/*.ts" "test/**/*.ts"

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run HTTP tests with mocked dependencies
        run: npm run test:e2e -- --runInBand

      - name: Apply migrations to temporary test database
        run: npx --no-install prisma migrate deploy --config ./prisma7.config.ts

      - name: Run payment repository integration tests
        run: npm run test:integration

      - name: Run outbox repository integration tests
        run: >-
          node --experimental-vm-modules
          ./node_modules/jest/bin/jest.js
          --config ./test/jest-e2e.json
          --runInBand
          --testRegex 'outbox\.repository\.integration-spec\.ts$'

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high