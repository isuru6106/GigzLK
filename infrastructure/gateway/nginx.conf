worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    default_type application/json;

    client_max_body_size 8k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 4 8k;

    # Check the original URI, including any query string.
    map $request_uri $auth_path_allowed {
        default 0;
        "~^/internal/v1/auth/(login|refresh|session/check|logout|logout-all|mfa/challenge)$" 1;
    }

    # Reject absolute-form request targets in this private HTTP/1.x setup.
    map $request $origin_form_allowed {
        default 0;
        "~^[A-Z]+ /[^ ]* HTTP/1[.][01]$" 1;
    }

    # Enforce the encoded assertion limit.
    # Cryptographic validation remains the upstream Auth service's job.
    map $http_authorization $assertion_header_allowed {
        default 0;
        "~^Bearer [A-Za-z0-9._-]{1,4096}$" 1;
    }

    upstream auth_backend {
        server mock:3006;
    }

    # Public listener: no application routes are enabled yet.
    server {
        listen 8080 default_server;
        server_name _;

        add_header Cache-Control "no-store" always;

        location / {
            return 404;
        }
    }

    # Private listener: only exact credential-operation paths.
    server {
        listen 8443 ssl default_server;
        server_name gateway localhost;

        ssl_certificate /run/secrets/gateway_certificate;
        ssl_certificate_key /run/secrets/gateway_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header Cache-Control "no-store" always;

        if ($origin_form_allowed = 0) {
            return 400;
        }

        if ($auth_path_allowed = 0) {
            return 404;
        }

        if ($request_method != POST) {
            return 405;
        }

        if ($assertion_header_allowed = 0) {
            return 401;
        }

        location / {
            proxy_http_version 1.1;

            # Forward only explicitly selected request headers.
            proxy_pass_request_headers off;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header X-Request-ID $request_id;

            proxy_hide_header Cache-Control;
            proxy_hide_header Set-Cookie;

            proxy_cache off;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # No URI rewrite or suffix replacement.
            proxy_pass http://auth_backend;
        }
    }
}